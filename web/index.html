<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenNet</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 420px;
            max-width: calc(100% - 40px);
            padding: 30px;
            background: #161b22;
            border-radius: 16px;
        }

        h1 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #238636;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .key {
            margin-top: 20px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }

        .warning {
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>OpenNet</h1>

    <p>Local control panel</p>

    <button onclick="generateKey()">
        Generate client key
    </button>

    <div id="key" class="key"></div>

    <div class="warning">
        Never share your private key.
    </div>
</div>

<script>
async function generateKey() {
    const response = await fetch("/api/key", {
        method: "POST"
    });

    if (!response.ok) {
        alert("Failed to generate key");
        return;
    }

    const data = await response.json();

    const element = document.getElementById("key");

    element.style.display = "block";

    element.textContent =
        "Public key: " + data.public_key +
        "\n\nPrivate key: " + data.private_key;
}
</script>

</body>
</html>
