<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OpenNet</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #ffffff;
        }

        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        button {
            background: #238636;
            color: white;
            border: 0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<main>
    <h1>OpenNet</h1>

    <p>Open-source network connectivity framework.</p>

    <div class="card">
        <h2>Client key</h2>

        <button onclick="generateKey()">
            Generate key
        </button>

        <pre id="key">No key generated.</pre>
    </div>
</main>

<script>
async function generateKey() {
    const output = document.getElementById("key");

    output.textContent = "Generating...";

    try {
        const response = await fetch("/api/key", {
            method: "POST"
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        output.textContent = data.public_key;
    } catch (error) {
        output.textContent = "Error: " + error.message;
    }
}
</script>

</body>
</html>
